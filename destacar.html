<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>destacar.html</title>
</head>
<body>

<h1>destacar.html</h1>

<p>Escreva um nome e veja ele destacado na lista</p>
<p>Se o nome não estiver na lista, ou não for exatamente igual, ele não será destacado</p>

<input type="text" id="nome" oninput="destacar()">

<ol id="lista">
  <li>João</li>
  <li>Márcio</li>
  <li>Fabiana</li>
  <li>Jorge</li>
  <li>Silvana</li>
  <li>Luiz</li>
  <li>Carlos</li>
  <li>Pablo</li>
</ol>

<script>
function destacar() {
  var nome = document.getElementById("nome").value;
  var itens = document.getElementById("lista").getElementsByTagName("li");

  for (var i = 0; i < itens.length; i++) {
    if (itens[i].textContent === nome) {
      itens[i].style.color = "red";
      itens[i].style.fontWeight = "bold";
    } else {
      itens[i].style.color = "black";
      itens[i].style.fontWeight = "normal";
    }
  }
}
</script>

</body>
</html>
