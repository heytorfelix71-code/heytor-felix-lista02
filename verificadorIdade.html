<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>verificadorIdade.html</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #a6a1f0;
}
.container {
  max-width: 420px;
  margin: 40px auto;
  background-color: white;
  border-radius: 10px;
  overflow: hidden;
  text-align: center;
}
.container h1 {
  background-color: #a6a1f0;
  color: white;
  font-size: 22px;
  padding: 15px;
  margin: 0;
}
.conteudo {
  padding: 20px;
}
img {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  object-fit: cover;
  margin-top: 15px;
}
footer {
  background-color: #a6a1f0;
  color: white;
  font-size: 12px;
  padding: 8px;
}
</style>
</head>
<body>

<div class="container">
  <h1>Verificador de Idade</h1>
  <div class="conteudo">

    <p>
      Ano de Nascimento:
      <input type="number" id="ano" value="1994">
    </p>

    <p>
      Sexo:
      <input type="radio" name="sexo" value="M"> Masculino
      <input type="radio" name="sexo" value="F" checked> Feminino
    </p>

    <button onclick="verificar()">Verificar</button>

    <p id="resultado"></p>
    <img id="foto" src="" alt="">

  </div>
  <footer>© Uniderp</footer>
</div>

<script>
function verificar() {
  var ano = document.getElementById("ano").value;
  var idade = new Date().getFullYear() - ano;
  var sexo = document.querySelector('input[name="sexo"]:checked').value;

  var faixa = "";
  if (idade <= 2) {
    faixa = "bebe";
  } else if (idade <= 12) {
    faixa = "crianca";
  } else if (idade <= 17) {
    faixa = "adolescente";
  } else if (idade <= 59) {
    faixa = "adulto";
  } else {
    faixa = "idoso";
  }

  var genero = sexo === "M" ? "homem" : "mulher";
  if (faixa === "bebe") genero = sexo === "M" ? "menino" : "menina";
  if (faixa === "crianca") genero = sexo === "M" ? "menino" : "menina";
  if (faixa === "adolescente") genero = sexo === "M" ? "menino" : "menina";

  document.getElementById("resultado").innerHTML =
    "Detectamos " + genero + " com " + idade + " anos.";

  document.getElementById("foto").src = "imagens/" + faixa + "_" + sexo + ".jpg";
}

verificar();
</script>

</body>
</html>
